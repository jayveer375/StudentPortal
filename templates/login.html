<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDesk — Login</title>
    <meta name="description" content="ExamDesk Authentication Portal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            /* =========================================================
               OFF-WHITE BACKGROUND WITH BEIGE LOGIN CARD
               ========================================================= */
            --bg-base: #E8ECF2;
            --bg-surface: #E8ECF2;
            --bg-sunken: #E2E7EE;

            /* Beige Card Palette */
            --card-bg: #f8f6f4;
            --card-nm-dark: #D4C7B5;
            --card-nm-light: #FFFFFF;

            /* Neumorphic Shadows for Card on Off-White Canvas */
            --nm-dark: #C5CCD6;
            --nm-light: #FFFFFF;
            --nm-raised-card: 16px 20px 40px rgba(180, 188, 204, 0.45), -16px -16px 36px #FFFFFF;
            --nm-raised-card-hover: 18px 22px 45px rgba(175, 184, 200, 0.52), -18px -18px 40px #FFFFFF;

            /* Sky-blue 3D depth shadow for login card */
            --card-sky-shadow:
                /* Layer 1 — near lift, soft blue tint */
                0 4px 12px rgba(147, 197, 253, 0.30),
                /* Layer 2 — mid depth, steel blue */
                0 12px 32px rgba(96, 165, 250, 0.22),
                /* Layer 3 — deep ambient, muted slate-blue */
                0 28px 60px rgba(71, 130, 210, 0.18),
                /* Layer 4 — long-range ground shadow, near-black base */
                0 48px 90px rgba(30, 64, 120, 0.12),
                /* Top-left white bounce light for 3D illusion */
                -8px -8px 24px rgba(255, 255, 255, 0.80);

            /* Neumorphic Inset / Raised on Beige Card */
            --nm-raised-btn: 6px 6px 14px var(--card-nm-dark), -6px -6px 14px var(--card-nm-light);
            --nm-raised-btn-hover: 8px 8px 18px #C5B6A2, -8px -8px 18px var(--card-nm-light);
            --nm-inset-well: inset 4px 4px 8px var(--card-nm-dark), inset -4px -4px 8px var(--card-nm-light);

            /* Dashboard Vibrant Accents */
            --accent-blue-start: #3B82F6;
            --accent-blue-end: #1D4ED8;
            --accent-blue-glow: 4px 8px 22px rgba(37, 99, 235, 0.42), -4px -4px 10px var(--card-nm-light);

            --brand-primary: #2563EB;
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;
        }

        /* =========================================================
           MINIMALIST LANDSCAPE LOGIN PAGE WITH PORTRAIT SUNRISE VIDEO
           ========================================================= */
        .login-viewport {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(circle at 50% 48%, #FFFFFF 0%, #F5F7FB 40%, #E8ECF2 100%);
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        /* Ambient soft background glow */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }

        /* Large radiant sunburst light centered directly behind the login card */
        .glow-center {
            width: 1100px;
            height: 720px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 1) 0%, rgba(241, 245, 250, 0.85) 35%, rgba(226, 232, 240, 0.35) 65%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(40px);
            opacity: 1;
            z-index: 1;
            animation: pulseCenterLight 8s ease-in-out infinite alternate;
        }

        @keyframes pulseCenterLight {
            0% {
                transform: translate(-50%, -50%) scale(0.98);
                opacity: 0.92;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.04);
                opacity: 1;
            }
        }

        .glow-1 {
            width: 620px;
            height: 620px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(191, 219, 254, 0.35) 40%, rgba(59, 130, 246, 0) 70%);
            top: -120px;
            left: -100px;
            filter: blur(90px);
            opacity: 0.7;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(224, 231, 255, 0.35) 40%, rgba(147, 197, 253, 0) 70%);
            bottom: -100px;
            right: -80px;
            filter: blur(90px);
            opacity: 0.65;
            animation-delay: -7s;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(35px, 45px) scale(1.08);
            }
        }

        /* Landscape Login Card */
        .login-landscape-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 860px;
            min-height: 520px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: var(--card-sky-shadow);
            border: 1px solid rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: row;
            overflow: hidden;
            transition: box-shadow 0.35s ease, transform 0.35s ease;
        }

        .login-landscape-card:hover {
            transform: translateY(-4px) scale(1.004);
            box-shadow:
                0 6px 16px rgba(147, 197, 253, 0.35),
                0 18px 42px rgba(96, 165, 250, 0.26),
                0 36px 72px rgba(71, 130, 210, 0.20),
                0 60px 110px rgba(30, 64, 120, 0.14),
                -10px -10px 30px rgba(255, 255, 255, 0.85);
        }

        /* =========================================================
           LEFT PANEL: PORTRAIT SUNRISE VIDEO WITH TOP QUOTE
           ========================================================= */
        .card-visual-panel {
            width: 360px;
            flex: 0 0 360px;
            height: 520px;
            min-height: 520px;
            position: relative;
            background: #0F172A;
            border-right: 1px solid rgba(212, 199, 181, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            padding: 0;
            border-top-left-radius: 27px;
            border-bottom-left-radius: 27px;
        }

        .sunrise-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            border-top-left-radius: 27px;
            border-bottom-left-radius: 27px;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Quote Container: Floating Text with High Readability */
        .video-quote-container {
            position: absolute;
            top: 28px;
            left: 20px;
            right: 20px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .video-quote-card {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .video-quote-text {
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.5;
            font-style: italic;
            letter-spacing: 0.25px;
            margin: 0;
        }

        /* Cinematic top-down vignette gradient across the sky for seamless quote integration */
        .video-edge-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg,
                    rgba(15, 23, 42, 0.72) 0%,
                    rgba(15, 23, 42, 0.48) 22%,
                    rgba(15, 23, 42, 0.18) 38%,
                    transparent 52%,
                    rgba(15, 23, 42, 0.35) 100%);
            pointer-events: none;
            border-top-left-radius: 27px;
            border-bottom-left-radius: 27px;
            z-index: 2;
        }

        /* =========================================================
           RIGHT PANEL: CLEAN FORM & HEADER ABOVE INPUTS
           ========================================================= */
        .card-form-panel {
            flex: 1;
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
        }

        /* Brand Header (Positioned Directly Above Both Input Boxes) */
        .form-brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            text-align: center;
        }

        .brand-logo-box {
            width: 72px;
            height: 72px;
            background: var(--card-bg);
            border-radius: 22px;
            box-shadow: var(--nm-raised-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-primary);
            border: 1px solid rgba(255, 255, 255, 0.95);
            margin-bottom: 14px;
            transition: transform 0.2s ease;
        }

        .brand-logo-box:hover {
            transform: translateY(-2px);
            box-shadow: var(--nm-raised-btn-hover);
        }

        .brand-logo-box svg {
            width: 38px;
            height: 38px;
            stroke: var(--brand-primary);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-project-name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .brand-project-name .highlight {
            color: var(--brand-primary);
        }

        /* Form Controls */
        .auth-form {
            width: 100%;
            max-width: 340px;
        }

        .form-group {
            margin-bottom: 18px;
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF, 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 4px solid rgba(214, 208, 208, 0.95);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .input-wrapper:hover {
            border-color: rgba(37, 99, 235, 0.45);
            box-shadow: inset 4px 4px 9px #C9BBA7, inset -4px -4px 9px #FFFFFF, 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-wrapper:focus-within {
            border-color: #2563EB;
            box-shadow: inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF, 0 0 0 4.5px rgba(37, 99, 235, 0.25), 0 4px 18px rgba(37, 99, 235, 0.2);
            background: #FAF7F2;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #78716C;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 2;
        }

        .input-wrapper:focus-within .input-icon {
            color: #2563EB;
            transform: scale(1.1);
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 46px 0 48px;
            background: transparent !important;
            border: none;
            outline: none;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            border-radius: 16px;
            position: relative;
            z-index: 1;
        }

        .form-input::placeholder {
            color: #A8A29E;
            font-weight: 400;
        }

        /* Defeat Browser / Chrome Autofill Light Blue Box & Preserve Neumorphic Inset Well */
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus,
        .form-input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px var(--card-bg) inset, inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF !important;
            box-shadow: 0 0 0 1000px var(--card-bg) inset, inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF !important;
            -webkit-text-fill-color: var(--text-primary) !important;
            caret-color: var(--text-primary) !important;
            font-family: var(--font-body) !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            border-radius: 16px !important;
            transition: background-color 50000s ease-in-out 0s;
        }

        .form-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #FAF7F2 inset, inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF !important;
            box-shadow: 0 0 0 1000px #FAF7F2 inset, inset 4px 4px 8px #D1C4B2, inset -4px -4px 8px #FFFFFF !important;
        }

        /* View Password Toggle Button */
        .toggle-password-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #64748B;
            cursor: pointer;
            padding: 8px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, background-color 0.2s ease;
            z-index: 2;
        }

        .toggle-password-btn:hover {
            color: #2563EB;
            background-color: rgba(37, 99, 235, 0.08);
        }

        /* Error Banner */
        .auth-error-box {
            background: #FEF2F2;
            border-left: 4px solid #EF4444;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #991B1B;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: var(--nm-raised-sm);
            width: 100%;
            max-width: 340px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shake-animation {
            animation: shake 0.45s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }

        /* Authenticate & Enter Button */
        .btn-auth-submit {
            width: 100%;
            height: 50px;
            margin-top: 4px;
            background: linear-gradient(135deg, var(--accent-blue-start) 0%, var(--accent-blue-end) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: var(--accent-blue-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-auth-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.5), -4px -4px 10px var(--nm-light);
        }

        .btn-auth-submit:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-auth-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        /* Button Spinner */
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .is-loading .btn-spinner {
            display: inline-block;
        }

        .is-loading .btn-text,
        .is-loading .btn-icon {
            display: none;
        }

        /* Responsive Breakpoint for Tablets and Mobiles */
        @media (max-width: 768px) {
            .login-viewport {
                padding: 20px 14px;
            }

            .login-landscape-card {
                flex-direction: column;
                max-width: 440px;
                min-height: auto;
                border-radius: 24px;
            }

            .card-visual-panel {
                width: 100%;
                flex: none;
                min-height: 200px;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid rgba(197, 204, 214, 0.45);
                border-top-left-radius: 23px;
                border-top-right-radius: 23px;
                border-bottom-left-radius: 0;
            }

            .sunrise-video {
                border-top-left-radius: 23px;
                border-top-right-radius: 23px;
                border-bottom-left-radius: 0;
            }

            .video-edge-overlay {
                border-top-left-radius: 23px;
                border-top-right-radius: 23px;
                border-bottom-left-radius: 0;
            }

            .video-quote-container {
                top: 18px;
                left: 16px;
                right: 16px;
            }

            .video-quote-text {
                font-size: 13.5px;
                line-height: 1.45;
            }

            .card-form-panel {
                padding: 28px 22px 34px;
            }

            .form-brand-header {
                margin-bottom: 22px;
            }

            .brand-logo-box {
                width: 62px;
                height: 62px;
                border-radius: 18px;
                margin-bottom: 10px;
            }

            .brand-logo-box svg {
                width: 32px;
                height: 32px;
            }

            .brand-project-name {
                font-size: 26px;
            }
        }

        /* Responsive Breakpoint for Compact Smartphones (<= 480px) */
        @media (max-width: 480px) {
            .login-viewport {
                padding: 14px 10px;
            }

            .login-landscape-card {
                border-radius: 20px;
                box-shadow: 0 12px 30px rgba(71, 130, 210, 0.18), -6px -6px 20px rgba(255, 255, 255, 0.85);
            }

            .card-visual-panel {
                min-height: 160px;
                height: 160px;
                border-top-left-radius: 19px;
                border-top-right-radius: 19px;
            }

            .sunrise-video,
            .video-edge-overlay {
                border-top-left-radius: 19px;
                border-top-right-radius: 19px;
            }

            .video-quote-container {
                top: 14px;
            }

            .video-quote-text {
                font-size: 12px;
            }

            .card-form-panel {
                padding: 20px 16px 26px;
            }

            .form-brand-header {
                margin-bottom: 16px;
            }

            .brand-logo-box {
                width: 52px;
                height: 52px;
                border-radius: 16px;
                margin-bottom: 8px;
            }

            .brand-logo-box svg {
                width: 26px;
                height: 26px;
            }

            .brand-project-name {
                font-size: 22px;
            }

            .auth-form {
                max-width: 100%;
            }

            .form-group {
                margin-bottom: 14px;
            }

            .input-wrapper {
                border-radius: 14px;
            }

            .form-input {
                height: 48px;
                font-size: 14.5px;
                padding: 0 42px 0 44px;
            }

            .btn-auth-submit {
                height: 48px;
                font-size: 14.5px;
                border-radius: 13px;
            }
        }

        /* Mobile Landscape Orientation Optimization */
        @media (max-height: 540px) and (orientation: landscape) {
            .login-viewport {
                padding: 12px 16px;
                min-height: 100vh;
            }

            .login-landscape-card {
                flex-direction: row;
                max-width: 660px;
                min-height: 310px;
            }

            .card-visual-panel {
                width: 250px;
                flex: 0 0 250px;
                min-height: 310px;
                height: auto;
                border-right: 1px solid rgba(212, 199, 181, 0.5);
                border-bottom: none;
                border-top-left-radius: 27px;
                border-bottom-left-radius: 27px;
                border-top-right-radius: 0;
            }

            .sunrise-video,
            .video-edge-overlay {
                border-top-left-radius: 27px;
                border-bottom-left-radius: 27px;
                border-top-right-radius: 0;
            }

            .card-form-panel {
                padding: 18px 24px;
            }

            .form-brand-header {
                margin-bottom: 12px;
            }

            .brand-logo-box {
                width: 44px;
                height: 44px;
                border-radius: 14px;
                margin-bottom: 6px;
            }

            .brand-logo-box svg {
                width: 22px;
                height: 22px;
            }

            .brand-project-name {
                font-size: 20px;
            }

            .form-group {
                margin-bottom: 10px;
            }

            .form-input {
                height: 44px;
                font-size: 14px;
            }

            .btn-auth-submit {
                height: 44px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="login-viewport">
        <!-- Ambient Glowing Background -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <div class="ambient-glow glow-center"></div>

        <!-- Landscape Login Card -->
        <div class="login-landscape-card" id="loginCard">
            <!-- Left Side: Portrait Sunrise Video Presentation with Quote at Top -->
            <div class="card-visual-panel">
                <!-- Text Quote at top of video -->
                <div class="video-quote-container">
                    <div class="video-quote-card">
                        <p class="video-quote-text">&ldquo;If you want to shine like a sun,<br>first burn like a
                            sun.&rdquo;</p>
                    </div>
                </div>

                <video class="sunrise-video" autoplay loop muted playsinline preload="auto">
                    <source src="{{ url_for('static', filename='sunrise/genrate_gif_animation_where_ru.mp4') }}"
                        type="video/mp4">
                    <source src="/sunrise/genrate_gif_animation_where_ru.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-edge-overlay"></div>
            </div>

            <!-- Right Side: Clean Form with Logo & ExamDesk Above Both Inputs -->
            <div class="card-form-panel">
                <!-- Brand Header Placed Directly Above the Inputs -->
                <div class="form-brand-header">
                    <div class="brand-logo-box">
                        <svg viewBox="0 0 24 24">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                    <h1 class="brand-project-name">Exam<span class="highlight">Desk</span></h1>
                </div>

                <!-- Error Banner -->
                <div id="errorAlert" class="auth-error-box"
                    style="display: {% if error %}flex{% else %}none{% endif %};">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span id="errorMessage">{% if error %}{{ error }}{% else %}Invalid credentials. Please try again.{%
                        endif %}</span>
                </div>

                <!-- Inputs & Authenticate Button Form -->
                <form id="loginForm" class="auth-form" method="POST" action="{{ url_for('login') }}" novalidate>
                    <!-- Email Input -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                            </span>
                            <input type="email" id="username" name="username" class="form-input"
                                placeholder="Email Address" value="{{ username or '' }}" required autocomplete="username"
                                spellcheck="false" autofocus>
                        </div>
                    </div>

                    <!-- Password Input with View Password Button -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                </svg>
                            </span>
                            <input type="password" id="password" name="password" class="form-input"
                                placeholder="Password" required autocomplete="current-password">
                            <!-- View Password Button -->
                            <button type="button" class="toggle-password-btn" id="togglePasswordBtn"
                                aria-label="View password">
                                <!-- Eye icon (Show) -->
                                <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <!-- Eye-off icon (Hide) -->
                                <svg id="eyeOffIcon" width="19" height="19" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" style="display: none;">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Authenticate & Enter Button -->
                    <button type="submit" class="btn-auth-submit" id="submitBtn">
                        <span class="btn-spinner"></span>
                        <span class="btn-text">Authenticate & Enter</span>
                        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12" />
                            <polyline points="12 5 19 12 12 19" />
                        </svg>
                    </button>

                    <!-- Student Login Tip -->
                    <div style="text-align: center; margin-top: 14px; font-size: 12px; color: #78716C; font-weight: 600; line-height: 1.4;">
                        Students: Initial default password is your Enrollment No.
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- =========================================================
         CUSTOM CURSOR EFFECT (Curzr - Arrow Pointer from cursoreffect)
         ========================================================= -->
    <div class="curzr-arrow-pointer" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <path class="inner"
                d="M25,30a5.82,5.82,0,0,1-1.09-.17l-.2-.07-7.36-3.48a.72.72,0,0,0-.35-.08.78.78,0,0,0-.33.07L8.24,29.54a.66.66,0,0,1-.2.06,5.17,5.17,0,0,1-1,.15,3.6,3.6,0,0,1-3.29-5L12.68,4.2a3.59,3.59,0,0,1,6.58,0l9,20.74A3.6,3.6,0,0,1,25,30Z"
                fill="#F2F5F8" />
            <path class="outer"
                d="M16,3A2.59,2.59,0,0,1,18.34,4.6l9,20.74A2.59,2.59,0,0,1,25,29a5.42,5.42,0,0,1-.86-.15l-7.37-3.48a1.84,1.84,0,0,0-.77-.17,1.69,1.69,0,0,0-.73.16l-7.4,3.31a5.89,5.89,0,0,1-.79.12,2.59,2.59,0,0,1-2.37-3.62L13.6,4.6A2.58,2.58,0,0,1,16,3m0-2h0A4.58,4.58,0,0,0,11.76,3.8L2.84,24.33A4.58,4.58,0,0,0,7,30.75a6.08,6.08,0,0,0,1.21-.17,1.87,1.87,0,0,0,.4-.13L16,27.18l7.29,3.44a1.64,1.64,0,0,0,.39.14A6.37,6.37,0,0,0,25,31a4.59,4.59,0,0,0,4.21-6.41l-9-20.75A4.62,4.62,0,0,0,16,1Z"
                fill="#111920" />
        </svg>
    </div>

    <script>
        // Ensure video auto-plays seamlessly and autofocus first textbox
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            if (usernameInput) {
                setTimeout(() => usernameInput.focus(), 150);
            }

            const video = document.querySelector('.sunrise-video');
            if (video) {
                video.muted = true;
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        document.body.addEventListener('click', () => video.play(), { once: true });
                    });
                }
            }
        });

        // View Password Toggle
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.style.display = isPassword ? 'none' : 'block';
            eyeOffIcon.style.display = isPassword ? 'block' : 'none';
        });

        // Form Submit Handler with AJAX Validation
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const loginCard = document.getElementById('loginCard');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const usernameInput = document.getElementById('username');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showError('Please enter both Email and Password.');
                return;
            }

            // Loading state
            submitBtn.classList.add('is-loading');
            submitBtn.disabled = true;
            hideError();

            try {
                const response = await fetch("{{ url_for('login') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    submitBtn.style.background = 'linear-gradient(135deg, #16A34A 0%, #15803D 100%)';
                    submitBtn.classList.remove('is-loading');
                    submitBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span>Access Granted &bull; Entering...</span>
                    `;
                    window.location.href = result.redirect || "{{ url_for('index') }}";
                } else {
                    showError(result.error || 'Invalid credentials. Please verify your Admin email and password.');
                    submitBtn.classList.remove('is-loading');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.warn('AJAX login failed, falling back to standard POST:', err);
                loginForm.submit();
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.style.display = 'flex';
            loginCard.classList.remove('shake-animation');
            void loginCard.offsetWidth;
            loginCard.classList.add('shake-animation');
        }

        function hideError() {
            errorAlert.style.display = 'none';
        }

        // =========================================================
        // CUSTOM CURSOR EFFECT (Curzr - Arrow Pointer)
        // =========================================================
        class ArrowPointer {
            constructor() {
                this.root = document.body;
                this.cursor = document.querySelector(".curzr-arrow-pointer");

                this.position = {
                    distanceX: 0,
                    distanceY: 0,
                    distance: 0,
                    pointerX: 0,
                    pointerY: 0,
                };
                this.previousPointerX = 0;
                this.previousPointerY = 0;
                this.angle = 0;
                this.previousAngle = 0;
                this.angleDisplace = 0;
                this.degrees = 57.296;
                this.cursorSize = 20;

                this.cursorStyle = {
                    boxSizing: 'border-box',
                    position: 'fixed',
                    top: '0px',
                    left: '0px',
                    transform: 'translate(0, 0)',
                    zIndex: '2147483647',
                    width: `${this.cursorSize}px`,
                    height: `${this.cursorSize}px`,
                    transition: '250ms, transform 100ms',
                    userSelect: 'none',
                    pointerEvents: 'none',
                };

                this.init(this.cursor, this.cursorStyle);
            }

            init(el, style) {
                if (!el) return;
                Object.assign(el.style, style);
                setTimeout(() => {
                    el.removeAttribute("hidden");
                }, 300);
                el.style.opacity = 1;
            }

            move(event) {
                if (!this.cursor) return;
                this.previousPointerX = this.position.pointerX;
                this.previousPointerY = this.position.pointerY;
                this.position.pointerX = event.clientX;
                this.position.pointerY = event.clientY;
                this.position.distanceX = this.previousPointerX - this.position.pointerX;
                this.position.distanceY = this.previousPointerY - this.position.pointerY;
                this.distance = Math.sqrt(
                    this.position.distanceY ** 2 + this.position.distanceX ** 2
                );

                this.cursor.style.transform = `translate3d(${this.position.pointerX}px, ${this.position.pointerY}px, 0)`;

                if (this.distance > 1) {
                    this.rotate(this.position);
                } else {
                    this.cursor.style.transform += ` rotate(${this.angleDisplace}deg)`;
                }
            }

            rotate(position) {
                let unsortedAngle =
                    Math.atan(Math.abs(position.distanceY) / Math.abs(position.distanceX)) *
                    this.degrees;
                this.previousAngle = this.angle;

                if (position.distanceX <= 0 && position.distanceY >= 0) {
                    this.angle = 90 - unsortedAngle + 0;
                } else if (position.distanceX < 0 && position.distanceY < 0) {
                    this.angle = unsortedAngle + 90;
                } else if (position.distanceX >= 0 && position.distanceY <= 0) {
                    this.angle = 90 - unsortedAngle + 180;
                } else if (position.distanceX > 0 && position.distanceY > 0) {
                    this.angle = unsortedAngle + 270;
                }

                if (isNaN(this.angle)) {
                    this.angle = this.previousAngle;
                } else {
                    if (this.angle - this.previousAngle <= -270) {
                        this.angleDisplace += 360 + this.angle - this.previousAngle;
                    } else if (this.angle - this.previousAngle >= 270) {
                        this.angleDisplace += this.angle - this.previousAngle - 360;
                    } else {
                        this.angleDisplace += this.angle - this.previousAngle;
                    }
                }
                this.cursor.style.left = `${-this.cursorSize / 2}px`;
                this.cursor.style.top = `0px`;
                this.cursor.style.transform += ` rotate(${this.angleDisplace}deg)`;
            }

            click() {
                if (!this.cursor) return;
                this.cursor.style.transform += ` scale(0.75)`;
                setTimeout(() => {
                    this.cursor.style.transform = this.cursor.style.transform.replace(
                        ` scale(0.75)`,
                        ''
                    );
                }, 35);
            }
        }

        // Boot custom cursor (only on devices with mouse/trackpad fine pointer)
        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(pointer: fine)').matches) {
                return;
            }

            const cursorEl = document.querySelector('.curzr-arrow-pointer');
            if (cursorEl) {
                const cursor = new ArrowPointer();
                document.addEventListener('mousemove', (e) => cursor.move(e));
                document.addEventListener('click', () => cursor.click());
                document.addEventListener('touchstart', () => {
                    cursorEl.style.display = 'none';
                }, { once: true });
            }
        });
    </script>
</body>

</html>
